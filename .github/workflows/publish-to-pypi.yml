name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.repository == 'CiscoDevNet/sccfm-devkit'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify version matches release tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              pyproject = tomllib.load(pyproject_file)

          print(pyproject["tool"]["poetry"]["version"])
          PY
          )"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION, pyproject.toml=$PKG_VERSION"
            exit 1
          fi

          echo "Version OK: $PKG_VERSION"
          echo "package_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build and verify package artifacts
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="dist"
          WHEEL_PATH="${ARTIFACT_DIR}/cisco_sccfm_devkit-${PACKAGE_VERSION}-py3-none-any.whl"
          SDIST_PATH="${ARTIFACT_DIR}/cisco_sccfm_devkit-${PACKAGE_VERSION}.tar.gz"

          test ! -e "${ARTIFACT_DIR}"
          python -m build --outdir "${ARTIFACT_DIR}"
          test -f "${WHEEL_PATH}"
          test -f "${SDIST_PATH}"

          ARTIFACT_COUNT="$(find "${ARTIFACT_DIR}" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          if [[ "${ARTIFACT_COUNT}" != "2" ]]; then
            echo "Expected exactly one wheel and one sdist; found ${ARTIFACT_COUNT} files"
            exit 1
          fi

          python -m cisco_sccfm_scripts.verify_python_artifacts \
            "${WHEEL_PATH}" \
            "${SDIST_PATH}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
