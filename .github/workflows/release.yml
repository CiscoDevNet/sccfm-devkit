name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact stable version to release (X.Y.Z, without a leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  PIP_AUDIT_VERSION: "2.10.1"
  # The pinned SCCFM SDK requires urllib3<2.1; keep these explicit until the SDK
  # permits a patched urllib3 release.
  DEP002_PIP_AUDIT_EXCEPTIONS: >-
    --ignore-vuln PYSEC-2026-141
    --ignore-vuln PYSEC-2026-1994
    --ignore-vuln PYSEC-2026-1995
    --ignore-vuln PYSEC-2026-1996
    --ignore-vuln PYSEC-2026-1998
    --ignore-vuln PYSEC-2026-1999

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.source.outputs.source_commit || steps.version.outputs.source_commit }}
      bundle_name: ${{ steps.source.outputs.bundle_name || steps.version.outputs.bundle_name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.SCCFM_CI_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pipx and Poetry
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --with dev,build

      - name: Validate requested release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "CiscoDevNet/sccfm-devkit"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"

          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be canonical stable X.Y.Z without a leading v"
            exit 1
          fi

          CURRENT_VERSION="$(poetry version -s)"
          RELEASE_TAG="v${RELEASE_VERSION}"
          RESUME_RELEASE=false
          if [[ "${CURRENT_VERSION}" = "${RELEASE_VERSION}" ]]; then
            if [[ "${GITHUB_RUN_ATTEMPT}" -le 1 ]]; then
              echo "::error::version ${RELEASE_VERSION} is already current; only a retry of the original workflow run can resume it"
              exit 1
            fi
            RESUME_RELEASE=true
          else
            python - "${CURRENT_VERSION}" "${RELEASE_VERSION}" <<'PY'
          import re
          import sys

          pattern = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          current, requested = sys.argv[1:]
          if pattern.fullmatch(current) is None:
              raise SystemExit(f"current project version is not stable SemVer: {current}")
          current_parts = tuple(int(part) for part in current.split("."))
          requested_parts = tuple(int(part) for part in requested.split("."))
          if requested_parts <= current_parts:
              raise SystemExit(
                  f"release version must be greater than current version {current}"
              )
          PY
          fi

          if [[ "${RESUME_RELEASE}" = "true" ]]; then
            if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "::error::cannot resume without existing tag ${RELEASE_TAG}"
              exit 1
            fi
          elif git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::tag ${RELEASE_TAG} already exists"
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "${RESUME_RELEASE}" != "true" ]]; then
              echo "::error::GitHub release ${RELEASE_TAG} already exists"
              exit 1
            fi
            RELEASE_IDENTITY="$(gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease,tagName \
              --jq 'select(.isPrerelease == false) | .tagName')"
            if [[ "${RELEASE_IDENTITY}" != "${RELEASE_TAG}" ]]; then
              echo "::error::existing GitHub release is not the expected stable release for ${RELEASE_TAG}"
              exit 1
            fi
          fi

          DRAFT_RELEASE_TAGS="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == true) | .tag_name')"
          while IFS= read -r draft_tag; do
            [[ -z "${draft_tag}" ]] && continue
            if [[ "${RESUME_RELEASE}" != "true" || "${draft_tag}" != "${RELEASE_TAG}" ]]; then
              echo "::error::unresolved draft release blocks a new production release: ${draft_tag}"
              exit 1
            fi
          done <<< "${DRAFT_RELEASE_TAGS}"

          for registry_and_url in \
            "PyPI|https://pypi.org/pypi/cisco-sccfm-devkit/${RELEASE_VERSION}/json" \
            "Ansible Galaxy|https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/cisco/sccfm/versions/${RELEASE_VERSION}/"; do
            registry="${registry_and_url%%|*}"
            registry_url="${registry_and_url#*|}"
            http_status="$(curl --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --max-filesize 1048576 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${registry_url}")"
            case "${http_status}" in
              404)
                ;;
              200)
                if [[ "${RESUME_RELEASE}" != "true" ]]; then
                  echo "::error::${registry} already contains version ${RELEASE_VERSION}"
                  exit 1
                fi
                ;;
              *)
                echo "::error::${registry} preflight failed with HTTP ${http_status}"
                exit 1
                ;;
            esac
          done

          if [[ "${RESUME_RELEASE}" = "true" ]]; then
            SOURCE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if ! git merge-base --is-ancestor "${SOURCE_COMMIT}" HEAD; then
              echo "::error::tag ${RELEASE_TAG} is not contained in checked-out main"
              exit 1
            fi

            BUNDLE_PREFIX="sccfm-release-${RELEASE_VERSION}-${SOURCE_COMMIT}-attempt-"
            RESUME_BUNDLES=()
            while IFS= read -r artifact_name; do
              if [[ "${artifact_name}" = "${BUNDLE_PREFIX}"* ]] \
                && [[ "${artifact_name#${BUNDLE_PREFIX}}" =~ ^[1-9][0-9]*$ ]]; then
                RESUME_BUNDLES+=("${artifact_name}")
              fi
            done < <(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .name'
            )
            if [[ "${#RESUME_BUNDLES[@]}" -ne 1 ]]; then
              echo "::error::expected exactly one unexpired manifest-bound bundle from this workflow run"
              exit 1
            fi
            BUNDLE_NAME="${RESUME_BUNDLES[0]}"
            RESUME_ROOT="${RUNNER_TEMP}/release-resume-bundle"
            mkdir -p "${RESUME_ROOT}"
            gh run download "${GITHUB_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${BUNDLE_NAME}" \
              --dir "${RESUME_ROOT}"
            poetry run python -m cisco_sccfm_scripts.release_artifacts verify \
              "${RESUME_ROOT}" \
              --version "${RELEASE_VERSION}" \
              --tag "${RELEASE_TAG}" \
              --source-commit "${SOURCE_COMMIT}"
            echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
            echo "bundle_name=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "resume=${RESUME_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Synchronize exact release version
        if: steps.version.outputs.resume != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
        run: |
          set -euo pipefail
          poetry run cz bump "${RELEASE_VERSION}" \
            --yes \
            --changelog \
            --files-only \
            --check-consistency
          test "$(poetry version -s)" = "${RELEASE_VERSION}"
          poetry install --only-root --no-interaction
          INSTALLED_VERSION="$(poetry run python -c \
            'from importlib.metadata import version; print(version("cisco-sccfm-devkit"))')"
          test "${INSTALLED_VERSION}" = "${RELEASE_VERSION}"
          poetry run python -m cisco_sccfm_scripts.prepare_ansible_release \
            sccfm-ansible \
            --previous-version "${PREVIOUS_VERSION}" \
            --release-version "${RELEASE_VERSION}" \
            --release-date "$(date -u +%F)"
          poetry run generate-cli-docs
          poetry run generate-cli-man-docs
          poetry run generate-ansible-docs

      - name: Build release artifacts once
        if: steps.version.outputs.resume != 'true'
        id: artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test ! -e dist
          poetry run build-ansible-collection
          poetry build

          WHEEL_PATH="dist/cisco_sccfm_devkit-${RELEASE_VERSION}-py3-none-any.whl"
          SDIST_PATH="dist/cisco_sccfm_devkit-${RELEASE_VERSION}.tar.gz"
          COLLECTION_PATH="dist/cisco-sccfm-${RELEASE_VERSION}.tar.gz"
          test -f "${WHEEL_PATH}"
          test -f "${SDIST_PATH}"
          test -f "${COLLECTION_PATH}"

          ARTIFACT_COUNT="$(find dist -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          if [[ "${ARTIFACT_COUNT}" != "3" ]]; then
            echo "::error::expected exactly three release artifacts, found ${ARTIFACT_COUNT}"
            exit 1
          fi

          poetry run python -m cisco_sccfm_scripts.verify_python_artifacts \
            "${WHEEL_PATH}" "${SDIST_PATH}"
          pipx run --spec "twine==6.2.0" twine check --strict \
            "${WHEEL_PATH}" "${SDIST_PATH}"
          poetry run python -m cisco_sccfm_scripts.verify_ansible_collection \
            "${COLLECTION_PATH}" --expected-version "${RELEASE_VERSION}"

          echo "wheel_path=${WHEEL_PATH}" >> "$GITHUB_OUTPUT"
          echo "sdist_path=${SDIST_PATH}" >> "$GITHUB_OUTPUT"
          echo "collection_path=${COLLECTION_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run source gates
        if: steps.version.outputs.resume != 'true'
        run: |
          set -euo pipefail
          poetry check --strict --lock
          git ls-files '*.py' | xargs poetry run reuse lint-file
          poetry run black --check .
          poetry run isort --check-only .
          poetry run mypy \
            cisco_sccfm_cli \
            cisco_sccfm_core \
            cisco_sccfm_scripts/build_ansible_collection.py \
            cisco_sccfm_scripts/prepare_ansible_release.py \
            cisco_sccfm_scripts/release_artifacts.py \
            cisco_sccfm_scripts/verify_ansible_collection.py \
            cisco_sccfm_scripts/verify_clean_controller.py \
            cisco_sccfm_scripts/verify_pypi_release.py \
            cisco_sccfm_scripts/verify_python_artifacts.py
          poetry run pytest --color=yes
          poetry run check-doc-links
          poetry run check-doc-artifacts

      - name: Install pinned Gitleaks
        if: steps.version.outputs.resume != 'true'
        run: |
          GITLEAKS_BIN_DIR="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${GITLEAKS_BIN_DIR}"
          GOBIN="${GITLEAKS_BIN_DIR}" go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "${GITLEAKS_BIN_DIR}" >> "$GITHUB_PATH"

      - name: Scan exact release artifacts
        if: steps.version.outputs.resume != 'true'
        run: |
          set -euo pipefail
          WHEEL_SCAN_ROOT="$(mktemp -d "${RUNNER_TEMP}/sccfm-wheel-scan.XXXXXX")"
          python -m zipfile -e \
            "${{ steps.artifacts.outputs.wheel_path }}" \
            "${WHEEL_SCAN_ROOT}"
          gitleaks dir --no-banner --no-color --redact=100 "${WHEEL_SCAN_ROOT}"

          for artifact in \
            "${{ steps.artifacts.outputs.sdist_path }}" \
            "${{ steps.artifacts.outputs.collection_path }}"; do
            gitleaks dir \
              --no-banner \
              --no-color \
              --redact=100 \
              --max-archive-depth=1 \
              "${artifact}"
          done

      - name: Verify exact wheel and sdist installations
        if: steps.version.outputs.resume != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          read -r -a AUDIT_EXCEPTION_ARGS <<< "${DEP002_PIP_AUDIT_EXCEPTIONS}"

          verify_python_distribution() {
            local artifact_path="$1"
            local artifact_kind="$2"
            local smoke_root
            smoke_root="$(mktemp -d "${RUNNER_TEMP}/sccfm-${artifact_kind}-smoke.XXXXXX")"
            python -m venv "${smoke_root}/venv"
            local smoke_python="${smoke_root}/venv/bin/python"
            local smoke_cli="${smoke_root}/venv/bin/sccfm-cli"

            cd "${smoke_root}"
            "${smoke_python}" -I -m pip install --no-cache-dir "${artifact_path}"
            "${smoke_python}" -I -m pip check
            local requirements="${smoke_root}/runtime-requirements.txt"
            "${smoke_python}" -I -m pip freeze \
              --exclude cisco-sccfm-devkit \
              > "${requirements}"
            test -s "${requirements}"
            pipx run --spec "pip-audit==${PIP_AUDIT_VERSION}" pip-audit \
              --strict \
              --no-deps \
              --disable-pip \
              --vulnerability-service osv \
              --progress-spinner off \
              --aliases on \
              --desc off \
              "${AUDIT_EXCEPTION_ARGS[@]}" \
              --requirement "${requirements}"
            "${smoke_python}" -I - "${artifact_kind}" <<'PY'
          import importlib
          import sys
          from importlib.metadata import distribution, version
          from importlib.util import find_spec

          artifact_kind = sys.argv[1]
          if version("scc-firewall-manager-sdk") != "1.17.27":
              raise SystemExit("the installed SDK version is not the supported release pin")
          for package in (
              "scc_firewall_manager_sdk",
              "cisco_sccfm_cli",
              "cisco_sccfm_core",
          ):
              importlib.import_module(package)
          if find_spec("cisco_sccfm_scripts") is not None:
              raise SystemExit(f"repository scripts leaked into the public {artifact_kind}")
          console_scripts = {
              entry.name: entry.value
              for entry in distribution("cisco-sccfm-devkit").entry_points
              if entry.group == "console_scripts"
          }
          expected = {"sccfm-cli": "cisco_sccfm_cli.cli:cli"}
          if console_scripts != expected:
              raise SystemExit(f"unexpected public console scripts: {console_scripts}")
          PY
            "${smoke_cli}" --help >/dev/null
            "${smoke_cli}" schema export --format json | "${smoke_python}" -I -c \
              'from importlib.metadata import version; import json, sys; payload = json.load(sys.stdin); commands = payload.get("commands"); assert payload.get("version") == version("cisco-sccfm-devkit"); assert isinstance(commands, list) and len(commands) == 57'
          }

          unset PYTHONHOME PYTHONPATH POETRY_ACTIVE
          verify_python_distribution \
            "${GITHUB_WORKSPACE}/${{ steps.artifacts.outputs.wheel_path }}" wheel
          verify_python_distribution \
            "${GITHUB_WORKSPACE}/${{ steps.artifacts.outputs.sdist_path }}" sdist

      - name: Verify exact wheel and collection pair
        if: steps.version.outputs.resume != 'true'
        run: |
          poetry run python -m cisco_sccfm_scripts.verify_clean_controller \
            "${{ steps.artifacts.outputs.wheel_path }}" \
            "${{ steps.artifacts.outputs.collection_path }}" \
            --expected-version "${{ steps.version.outputs.version }}"

      - name: Run sanity against exact collection artifact
        if: steps.version.outputs.resume != 'true'
        run: |
          set -euo pipefail
          VENV_PATH="$(poetry env info --path)"
          SANITY_ROOT="$(mktemp -d "${RUNNER_TEMP}/sccfm-release-sanity.XXXXXX")"
          COLLECTION_ROOT="${SANITY_ROOT}/ansible_collections/cisco/sccfm"
          mkdir -p "${COLLECTION_ROOT}" "${SANITY_ROOT}/home" "${SANITY_ROOT}/local"
          tar -xzf "${{ steps.artifacts.outputs.collection_path }}" -C "${COLLECTION_ROOT}"
          cd "${COLLECTION_ROOT}"
          HOME="${SANITY_ROOT}/home" \
            XDG_CACHE_HOME="${SANITY_ROOT}/home/.cache" \
            ANSIBLE_LOCAL_TEMP="${SANITY_ROOT}/local" \
            "${VENV_PATH}/bin/ansible-test" sanity --local --truncate 0

      - name: Commit and tag verified source
        if: steps.version.outputs.resume != 'true'
        id: source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              CHANGELOG.md|pyproject.toml|sccfm-ansible/CHANGELOG.rst|\
              sccfm-ansible/changelogs/changelog.yaml|sccfm-ansible/galaxy.yml|\
              sccfm-ansible/plugins/module_utils/dependencies.py|\
              sccfm-ansible/requirements.txt|docs/cli/*|docs/man/*|docs/ansible/*)
                ;;
              *)
                echo "::error::release preparation changed unexpected path: ${changed_path}"
                exit 1
                ;;
            esac
          done < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.cisco.com"
          git add \
            CHANGELOG.md \
            pyproject.toml \
            sccfm-ansible/CHANGELOG.rst \
            sccfm-ansible/changelogs/changelog.yaml \
            sccfm-ansible/galaxy.yml \
            sccfm-ansible/plugins/module_utils/dependencies.py \
            sccfm-ansible/requirements.txt \
            docs/cli \
            docs/man \
            docs/ansible
          git commit -m "bump: version ${RELEASE_VERSION}" -m "[skip ci]"
          git tag "${RELEASE_TAG}"
          test -z "$(git status --porcelain)"

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          BUNDLE_NAME="sccfm-release-${RELEASE_VERSION}-${SOURCE_COMMIT}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create and verify release manifest
        if: steps.version.outputs.resume != 'true'
        id: manifest
        run: |
          poetry run python -m cisco_sccfm_scripts.release_artifacts create dist \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --source-commit "${{ steps.source.outputs.source_commit }}"
          echo "path=dist/release-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Preserve exact release bundle
        if: steps.version.outputs.resume != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.bundle_name }}
          path: |
            ${{ steps.artifacts.outputs.wheel_path }}
            ${{ steps.artifacts.outputs.sdist_path }}
            ${{ steps.artifacts.outputs.collection_path }}
            ${{ steps.manifest.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Push release commit and tag atomically
        if: steps.version.outputs.resume != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          if git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if REMOTE_REFS="$(git ls-remote --refs origin \
              refs/heads/main "refs/tags/${RELEASE_TAG}")"; then
              REMOTE_TAG_COMMIT="$(awk -v ref="refs/tags/${RELEASE_TAG}" \
                '$2 == ref { print $1 }' <<< "${REMOTE_REFS}")"
              if [[ "${REMOTE_TAG_COMMIT}" = "${SOURCE_COMMIT}" ]] \
                && git fetch --no-tags origin refs/heads/main \
                && git merge-base --is-ancestor "${SOURCE_COMMIT}" FETCH_HEAD; then
                echo "::warning::push reported failure, but the atomic remote update was verified"
                exit 0
              fi
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 2
            fi
          done
          echo "::error::atomic push failed and the intended remote state could not be verified"
          exit 1

  create-draft-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download exact release bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.bundle_name }}
          path: ${{ runner.temp }}/release-bundle

      - name: Verify bundle and upload draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build-release.outputs.source_commit }}
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          python -m cisco_sccfm_scripts.release_artifacts verify "${BUNDLE_DIR}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"

          RELEASE_IS_DRAFT=true
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,tagName \
            --jq '.tagName + "\t" + (.isDraft | tostring) + "\t" + (.isPrerelease | tostring)' \
              > "${RUNNER_TEMP}/release-identity" 2>/dev/null; then
            RELEASE_IDENTITY="$(cat "${RUNNER_TEMP}/release-identity")"
            case "${RELEASE_IDENTITY}" in
              "${RELEASE_TAG}"$'\ttrue\tfalse') RELEASE_IS_DRAFT=true ;;
              "${RELEASE_TAG}"$'\tfalse\tfalse') RELEASE_IS_DRAFT=false ;;
              *)
                echo "::error::existing release is not the expected stable release"
                exit 1
                ;;
            esac
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi

          for local_asset in "${BUNDLE_DIR}"/*; do
            asset_name="$(basename "${local_asset}")"
            existing_root="${RUNNER_TEMP}/existing-${asset_name}"
            mkdir -p "${existing_root}"
            if gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset_name}" \
              --dir "${existing_root}" >/dev/null 2>&1; then
              cmp -s "${local_asset}" "${existing_root}/${asset_name}" || {
                echo "::error::draft release asset differs: ${asset_name}"
                exit 1
              }
            else
              if [[ "${RELEASE_IS_DRAFT}" != "true" ]]; then
                echo "::error::public release is missing immutable asset ${asset_name}"
                exit 1
              fi
              gh release upload "${RELEASE_TAG}" "${local_asset}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
          done

          VERIFY_ROOT="${RUNNER_TEMP}/verified-draft-assets"
          mkdir -p "${VERIFY_ROOT}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${VERIFY_ROOT}"
          python -m cisco_sccfm_scripts.release_artifacts verify "${VERIFY_ROOT}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"

  publish-to-pypi:
    needs:
      - build-release
      - create-draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install publication checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine==6.2.0

      - name: Download exact release bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.bundle_name }}
          path: ${{ runner.temp }}/release-bundle

      - name: Verify bundle and inspect PyPI state
        id: pypi
        env:
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build-release.outputs.source_commit }}
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          python -m cisco_sccfm_scripts.release_artifacts verify "${BUNDLE_DIR}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"

          WHEEL_PATH="${BUNDLE_DIR}/cisco_sccfm_devkit-${RELEASE_VERSION}-py3-none-any.whl"
          SDIST_PATH="${BUNDLE_DIR}/cisco_sccfm_devkit-${RELEASE_VERSION}.tar.gz"
          python -m cisco_sccfm_scripts.verify_python_artifacts \
            "${WHEEL_PATH}" "${SDIST_PATH}"
          python -m twine check --strict "${WHEEL_PATH}" "${SDIST_PATH}"

          set +e
          PYPI_VERIFICATION="$(python -m cisco_sccfm_scripts.verify_pypi_release "${BUNDLE_DIR}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}")"
          PYPI_STATUS=$?
          set -e
          printf '%s\n' "${PYPI_VERIFICATION}"

          test ! -e dist
          mkdir dist
          case "${PYPI_STATUS}" in
            0)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              cp "${WHEEL_PATH}" "${SDIST_PATH}" dist/
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            3)
              MISSING_FILES="${PYPI_VERIFICATION##* missing=}"
              if [[ "${MISSING_FILES}" = "${PYPI_VERIFICATION}" ]] \
                || [[ -z "${MISSING_FILES}" ]] \
                || [[ "${MISSING_FILES}" = *$'\n'* ]]; then
                echo "::error::partial PyPI verification did not identify a missing artifact"
                exit 1
              fi
              IFS=',' read -r -a MISSING_ARTIFACTS <<< "${MISSING_FILES}"
              for missing_artifact in "${MISSING_ARTIFACTS[@]}"; do
                case "${missing_artifact}" in
                  "$(basename "${WHEEL_PATH}")")
                    cp "${WHEEL_PATH}" dist/
                    ;;
                  "$(basename "${SDIST_PATH}")")
                    cp "${SDIST_PATH}" dist/
                    ;;
                  *)
                    echo "::error::partial PyPI verification named an unexpected artifact"
                    exit 1
                    ;;
                esac
              done
              test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "${PYPI_STATUS}"
              ;;
          esac

          echo "packages_dir=dist/" >> "$GITHUB_OUTPUT"

      - name: Publish exact Python artifacts
        if: steps.pypi.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: ${{ steps.pypi.outputs.packages_dir }}

      - name: Verify published PyPI release
        env:
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build-release.outputs.source_commit }}
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if python -m cisco_sccfm_scripts.verify_pypi_release "${BUNDLE_DIR}" \
              --version "${RELEASE_VERSION}" \
              --tag "${RELEASE_TAG}" \
              --source-commit "${SOURCE_COMMIT}"; then
              break
            fi
            if [[ "${attempt}" = "12" ]]; then
              echo "::error::PyPI did not expose the verified release in time"
              exit 1
            fi
            sleep 5
          done

          INSTALL_ROOT="$(mktemp -d "${RUNNER_TEMP}/sccfm-pypi-install.XXXXXX")"
          python -m venv "${INSTALL_ROOT}/venv"
          "${INSTALL_ROOT}/venv/bin/python" -I -m pip install \
            --no-cache-dir \
            --index-url https://pypi.org/simple \
            "cisco-sccfm-devkit==${RELEASE_VERSION}"
          "${INSTALL_ROOT}/venv/bin/python" -I -m pip check
          "${INSTALL_ROOT}/venv/bin/sccfm-cli" --help >/dev/null
          "${INSTALL_ROOT}/venv/bin/sccfm-cli" schema export --format json \
            | "${INSTALL_ROOT}/venv/bin/python" -I -c \
              'from importlib.metadata import version; import json, sys; payload=json.load(sys.stdin); assert payload.get("version") == version("cisco-sccfm-devkit"); assert len(payload.get("commands", [])) == 57'

  publish-to-galaxy:
    needs:
      - build-release
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.20,<2.22"

      - name: Download exact release bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.bundle_name }}
          path: ${{ runner.temp }}/release-bundle

      - name: Verify bundle and inspect Galaxy state
        id: galaxy
        env:
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build-release.outputs.source_commit }}
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          python -m cisco_sccfm_scripts.release_artifacts verify "${BUNDLE_DIR}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"

          COLLECTION_PATH="${BUNDLE_DIR}/cisco-sccfm-${RELEASE_VERSION}.tar.gz"
          python -m cisco_sccfm_scripts.verify_ansible_collection \
            "${COLLECTION_PATH}" --expected-version "${RELEASE_VERSION}"
          LOCAL_SHA256="$(sha256sum "${COLLECTION_PATH}" | awk '{print $1}')"
          GALAXY_RESPONSE="${RUNNER_TEMP}/galaxy-version.json"
          GALAXY_URL="https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/cisco/sccfm/versions/${RELEASE_VERSION}/"
          LOOKUP_ATTEMPTS=1
          if [[ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]]; then
            # A previous upload can be accepted while Galaxy is still importing it.
            # Wait through the same ten-minute window used by collection publish before
            # treating a retry-time 404 as proof that the immutable version is absent.
            LOOKUP_ATTEMPTS=121
          fi
          for attempt in $(seq 1 "${LOOKUP_ATTEMPTS}"); do
            HTTP_STATUS="$(curl --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --max-filesize 1048576 \
              --output "${GALAXY_RESPONSE}" \
              --write-out '%{http_code}' \
              "${GALAXY_URL}")"
            if [[ "${HTTP_STATUS}" != "404" || "${attempt}" = "${LOOKUP_ATTEMPTS}" ]]; then
              break
            fi
            sleep 5
          done
          case "${HTTP_STATUS}" in
            200)
              test "$(jq -er '.version' "${GALAXY_RESPONSE}")" = "${RELEASE_VERSION}"
              test "$(jq -er '.artifact.filename' "${GALAXY_RESPONSE}")" \
                = "cisco-sccfm-${RELEASE_VERSION}.tar.gz"
              test "$(jq -er '.artifact.sha256' "${GALAXY_RESPONSE}")" = "${LOCAL_SHA256}"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Galaxy version lookup failed with HTTP ${HTTP_STATUS}"
              exit 1
              ;;
          esac
          echo "collection_path=${COLLECTION_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish exact collection and wait for import
        if: steps.galaxy.outputs.publish == 'true'
        env:
          ANSIBLE_GALAXY_SERVER_LIST: release
          ANSIBLE_GALAXY_SERVER_RELEASE_URL: https://galaxy.ansible.com/
          ANSIBLE_GALAXY_SERVER_RELEASE_TOKEN: ${{ secrets.GALAXY_API_KEY }}
          ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/ansible-local
        run: |
          mkdir -p "${ANSIBLE_LOCAL_TEMP}"
          ansible-galaxy collection publish \
            "${{ steps.galaxy.outputs.collection_path }}" \
            --server release \
            --timeout 60 \
            --import-timeout 600

      - name: Verify published Galaxy collection
        env:
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          COLLECTION_PATH: ${{ steps.galaxy.outputs.collection_path }}
          ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/ansible-local
        run: |
          set -euo pipefail
          mkdir -p "${ANSIBLE_LOCAL_TEMP}"
          LOCAL_SHA256="$(sha256sum "${COLLECTION_PATH}" | awk '{print $1}')"
          GALAXY_RESPONSE="${RUNNER_TEMP}/published-galaxy-version.json"
          GALAXY_URL="https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/cisco/sccfm/versions/${RELEASE_VERSION}/"
          for attempt in {1..12}; do
            HTTP_STATUS="$(curl --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --max-filesize 1048576 \
              --output "${GALAXY_RESPONSE}" \
              --write-out '%{http_code}' \
              "${GALAXY_URL}")"
            if [[ "${HTTP_STATUS}" = "200" ]]; then
              break
            fi
            if [[ "${attempt}" = "12" ]]; then
              echo "::error::Galaxy did not expose the imported collection in time"
              exit 1
            fi
            sleep 5
          done
          test "$(jq -er '.version' "${GALAXY_RESPONSE}")" = "${RELEASE_VERSION}"
          test "$(jq -er '.artifact.filename' "${GALAXY_RESPONSE}")" \
            = "cisco-sccfm-${RELEASE_VERSION}.tar.gz"
          test "$(jq -er '.artifact.sha256' "${GALAXY_RESPONSE}")" = "${LOCAL_SHA256}"

          DOWNLOAD_ROOT="$(mktemp -d "${RUNNER_TEMP}/sccfm-galaxy-download.XXXXXX")"
          ansible-galaxy collection download \
            "cisco.sccfm:==${RELEASE_VERSION}" \
            --server https://galaxy.ansible.com \
            --download-path "${DOWNLOAD_ROOT}" \
            --no-deps
          DOWNLOADED_COLLECTION="${DOWNLOAD_ROOT}/cisco-sccfm-${RELEASE_VERSION}.tar.gz"
          cmp -s "${COLLECTION_PATH}" "${DOWNLOADED_COLLECTION}"

          INSTALL_ROOT="$(mktemp -d "${RUNNER_TEMP}/sccfm-galaxy-install.XXXXXX")"
          python -m pip install \
            --no-cache-dir \
            --index-url https://pypi.org/simple \
            "cisco-sccfm-devkit==${RELEASE_VERSION}"
          ansible-galaxy collection install \
            "${DOWNLOADED_COLLECTION}" \
            --collections-path "${INSTALL_ROOT}" \
            --force
          ANSIBLE_COLLECTIONS_PATH="${INSTALL_ROOT}" \
            ansible-doc -j -l -t module cisco.sccfm > "${RUNNER_TEMP}/modules.json"
          ANSIBLE_COLLECTIONS_PATH="${INSTALL_ROOT}" \
            ansible-doc -j -l -t inventory cisco.sccfm > "${RUNNER_TEMP}/inventory.json"
          python - "${RUNNER_TEMP}/modules.json" "${RUNNER_TEMP}/inventory.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          modules = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          inventory = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if not isinstance(modules, dict) or len(modules) != 49:
              raise SystemExit("published Galaxy artifact did not expose 49 modules")
          if not isinstance(inventory, dict) or len(inventory) != 1:
              raise SystemExit("published Galaxy artifact did not expose one inventory plugin")
          PY

  publish-github-release:
    needs:
      - build-release
      - publish-to-galaxy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download exact release bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.bundle_name }}
          path: ${{ runner.temp }}/release-bundle

      - name: Reverify assets and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build-release.outputs.source_commit }}
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          python -m cisco_sccfm_scripts.release_artifacts verify "${BUNDLE_DIR}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"

          RELEASE_ASSETS_DIR="${RUNNER_TEMP}/final-release-assets"
          mkdir -p "${RELEASE_ASSETS_DIR}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RELEASE_ASSETS_DIR}"
          python -m cisco_sccfm_scripts.release_artifacts verify "${RELEASE_ASSETS_DIR}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"
          for local_asset in "${BUNDLE_DIR}"/*; do
            asset_name="$(basename "${local_asset}")"
            cmp -s "${local_asset}" "${RELEASE_ASSETS_DIR}/${asset_name}" || {
              echo "::error::GitHub release asset differs from verified bundle: ${asset_name}"
              exit 1
            }
          done

          RELEASE_IDENTITY="$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,tagName \
            --jq '.tagName + "\t" + (.isDraft | tostring) + "\t" + (.isPrerelease | tostring)')"
          RELEASE_TAG_NAME="${RELEASE_IDENTITY%%$'\t'*}"
          RELEASE_FLAGS="${RELEASE_IDENTITY#*$'\t'}"
          IS_DRAFT="${RELEASE_FLAGS%%$'\t'*}"
          IS_PRERELEASE="${RELEASE_FLAGS#*$'\t'}"
          test "${RELEASE_TAG_NAME}" = "${RELEASE_TAG}"
          test "${IS_PRERELEASE}" = "false"

          PUBLIC_RELEASE_TAGS="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          MAKE_LATEST="$(PUBLIC_RELEASE_TAGS="${PUBLIC_RELEASE_TAGS}" \
            python - "${RELEASE_VERSION}" <<'PY'
          import os
          import re
          import sys

          pattern = re.compile(
              r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
          )
          current = tuple(int(part) for part in sys.argv[1].split("."))
          public_versions = []
          for tag in os.environ.get("PUBLIC_RELEASE_TAGS", "").splitlines():
              match = pattern.fullmatch(tag)
              if match is not None:
                  public_versions.append(tuple(int(part) for part in match.groups()))
          print("false" if any(version > current for version in public_versions) else "true")
          PY
          )"
          if [[ "${MAKE_LATEST}" = "true" ]]; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --latest
          else
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --latest=false
          fi
          if [[ "${IS_DRAFT}" = "false" ]]; then
            echo "GitHub release ${RELEASE_TAG} is already public."
          else
            test "${IS_DRAFT}" = "true"
          fi
