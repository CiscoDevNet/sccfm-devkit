name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx and Poetry
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Lint
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run mypy sccfm_cli sccfm_core

      - name: Test
        run: poetry run pytest --color=yes

  release:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx and Poetry
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry
          pipx install commitizen

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Build Ansible collection
        run: poetry run build-ansible-collection

      - name: Bump version with Commitizen
        id: bump
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.cisco.com"
          cz bump --dry-run --yes --changelog || exit 0
          git add .
          cz bump --yes --changelog
          NEW_TAG=$(git describe --tags --abbrev=0)
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Push changes and tags
        if: steps.bump.outputs.bumped == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git push origin HEAD:${BRANCH}
          git push origin --tags

      - name: Build wheel
        run: poetry build -f wheel

      - name: Create release
        if: steps.bump.outputs.bumped == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.bump.outputs.new_tag }}
          artifacts: "dist/*.whl,dist/*.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}
