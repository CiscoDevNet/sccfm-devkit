name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Ensure Poetry on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: python -m poetry install --no-interaction --with dev

      - name: Lint
        run: |
          python -m poetry run black --check .
          python -m poetry run isort --check-only .
          python -m poetry run mypy sccfm_cli

      - name: Test
        run: python -m poetry run pytest --color=yes
