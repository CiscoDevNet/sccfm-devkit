name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx and Poetry
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: License headers
        run: git ls-files '*.py' | xargs poetry run reuse lint-file

      - name: Lint
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run mypy sccfm_cli sccfm_core

      - name: Generate docs
        run: |
          poetry run generate-cli-docs
          poetry run generate-ansible-docs

      - name: Check docs links
        run: poetry run check-doc-links

      - name: Test
        run: poetry run pytest --color=yes

  release:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx and Poetry
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry
          pipx install commitizen

      - name: Install dependencies
        run: poetry install --no-interaction --with dev,build

      - name: Bump version and build collection
        id: bump
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.cisco.com"

          # Check if version bump is needed
          cz bump --dry-run --yes --changelog || exit 0

          # Bump version in files only (no commit/tag yet)
          cz bump --yes --changelog --files-only
          NEW_VERSION=$(poetry version -s)
          NEW_TAG="v${NEW_VERSION}"

          # Build Ansible collection with updated version
          poetry run build-ansible-collection

          # Now commit everything together
          git add .
          git commit -m "bump: version ${NEW_VERSION}" -m "[skip ci]"
          git tag "${NEW_TAG}"

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Push changes and tags
        if: steps.bump.outputs.bumped == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git push origin HEAD:${BRANCH}
          git push origin --tags

      - name: Build wheel
        run: poetry build -f wheel

      - name: Create release
        if: steps.bump.outputs.bumped == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.bump.outputs.new_tag }}
          artifacts: "dist/*.whl,dist/*.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    needs: [lint-and-test, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx and Poetry
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Generate docs
        run: |
          poetry run generate-cli-docs
          poetry run generate-ansible-docs

      - name: Check docs links
        run: poetry run check-doc-links

      - name: Commit generated docs
        run: |
          if [ -z "$(git status --porcelain docs/cli docs/ansible)" ]; then
            echo "Generated docs are up to date."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.cisco.com"
          git add docs/cli docs/ansible
          git commit -m "docs: update generated references [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
