name: Consistency Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/consistency-check.yml"
      - "scripts/consistency_check.py"
      - "sccfm_cli/**/*.py"
      - "sccfm_core/**/*.py"
      - "sccfm-ansible/plugins/**/*.py"

jobs:
  consistency:
    name: PR Consistency Check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install checker dependencies
        run: poetry install --only build --no-interaction --no-root

      - name: Fetch pull request base
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Run consistency checks
        id: consistency
        continue-on-error: true
        run: |
          set +e
          poetry run python scripts/consistency_check.py \
            --base "${{ github.base_ref }}" \
            --annotations \
            --fail-on-warning | tee consistency-report.txt
          exit_code=${PIPESTATUS[0]}
          issue_count=$(python -c "import pathlib, re; text = pathlib.Path('consistency-report.txt').read_text(encoding='utf-8'); match = re.search(r'(\\d+) error\\(s\\), (\\d+) warning\\(s\\)', text); print((int(match.group(1)) + int(match.group(2))) if match else 0)")
          {
            echo "exit_code=$exit_code"
            echo "issue_count=$issue_count"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          short_sha="${GITHUB_SHA::7}"
          issue_count="${{ steps.consistency.outputs.issue_count }}"
          echo "### Consistency Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$issue_count" = "0" ]; then
            echo "Commit \`$short_sha\` has no consistency issues." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Commit \`$short_sha\` has **$issue_count** consistency issue(s)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Checker output</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,200p' consistency-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on pull request
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          CONSISTENCY_EXIT_CODE: ${{ steps.consistency.outputs.exit_code }}
          CONSISTENCY_ISSUE_COUNT: ${{ steps.consistency.outputs.issue_count }}
          CONSISTENCY_SHA: ${{ github.sha }}
          CONSISTENCY_REPORT_PATH: consistency-report.txt
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- consistency-check-comment -->";
            const shortSha = (process.env.CONSISTENCY_SHA || "").slice(0, 7);
            const issueCount = Number(process.env.CONSISTENCY_ISSUE_COUNT || "0");
            const reportPath = process.env.CONSISTENCY_REPORT_PATH;
            const rawReport = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, "utf8").trim()
              : "No checker output captured.";
            const maxReportChars = 60000;
            const clippedReport =
              rawReport.length > maxReportChars
                ? `${rawReport.slice(0, maxReportChars)}\n... output truncated ...`
                : rawReport;

            const summaryLine =
              issueCount === 0
                ? `Commit \`${shortSha}\` has no consistency issues.`
                : `Commit \`${shortSha}\` has **${issueCount}** consistency issue(s).`;

            const body = [
              marker,
              "### Consistency Check",
              "",
              summaryLine,
              "",
              "<details><summary>Checker output</summary>",
              "",
              "```text",
              clippedReport,
              "```",
              "</details>",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if consistency issues were found
        if: always() && steps.consistency.outputs.exit_code != '0'
        run: |
          echo "Consistency check failed with ${{ steps.consistency.outputs.issue_count }} issue(s)."
          exit 1
