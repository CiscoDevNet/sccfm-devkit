---
# Remove the CI CLI-dedicated vASA from the SCCFM tenant.
#
# Mirrors sccfm-ansible/e2e/asa/playbooks/remove_vasa.yml but only
# targets `ci-e2e-cli-asa-*` so it doesn't disturb the Ansible suite's
# device.  Runs as post-test cleanup so stale device records don't
# accumulate.  Uses the CDO REST API directly since there is no
# delete_device module yet.

- name: "CI: Remove CLI-dedicated vASA from SCCFM tenant"
  hosts: localhost
  gather_facts: false

  # sccfm_region / sccfm_api_token are supplied by run_e2e.sh via
  # -e "@${VARS_FILE}" -e "@${VAULT_FILE}".  Do NOT add vars_files here:
  # those are loaded/decrypted at parse time before the -e overrides
  # apply, which would force the default example files to exist and share
  # the same vault password even when the runner points elsewhere.

  vars:
    sccfm_api_base: "https://ci.manage.security.cisco.com/api/rest"
    asa_test_query_all: "name:ci-e2e-cli-asa-*"

  tasks:
    # The cleanup endpoints below are CI-region specific (the default
    # region template uses a different host *and* URL path), so onboarding
    # in one region and cleaning up against the hard-coded CI base would
    # silently leak the vASA.  Fail fast instead of deleting in the wrong
    # tenant.
    - name: Assert this is the CI region
      ansible.builtin.assert:
        that:
          - (sccfm_region | default('')) == 'ci'
        fail_msg: >-
          remove_vasa.yml only supports the 'ci' region (sccfm_api_base is
          hard-coded to the CI host); got sccfm_region='{{ sccfm_region | default('(unset)') }}'.

    - name: Find CI CLI vASA devices
      ansible.builtin.uri:
        url: "{{ sccfm_api_base }}/v1/inventory/devices?limit=50&offset=0&q={{ asa_test_query_all | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ sccfm_api_token }}"
          Content-Type: "application/json"
        status_code: [200]
      register: device_list

    - name: Delete each CI CLI vASA device
      ansible.builtin.uri:
        url: "{{ sccfm_api_base }}/v1/inventory/devices/{{ item.uid }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ sccfm_api_token }}"
          Content-Type: "application/json"
        status_code: [200, 202, 204, 404]
      loop: "{{ device_list.json['items'] | default([]) }}"
      loop_control:
        label: "{{ item.name }} ({{ item.uid }})"
      when: device_list.json['items'] | default([]) | length > 0
