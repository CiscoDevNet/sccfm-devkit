[tool.poetry]
name = "cisco-sccfm-devkit"
version = "0.38.0"
description = "Cisco SCC Firewall Manager CLI and Python automation library"
authors = ["Cisco Security Cloud Control Firewall Manager Team"]
license = "Apache-2.0"
homepage = "https://github.com/CiscoDevNet/sccfm-devkit"
repository = "https://github.com/CiscoDevNet/sccfm-devkit"
keywords = ["Cisco", "SCCFM", "Firewall Manager", "CLI", "Ansible", "Security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
readme = "README.md"
packages = [
    { include = "cisco_sccfm_cli" },
    { include = "cisco_sccfm_core" },
    { include = "cisco_sccfm_scripts" },
]

[tool.poetry.urls]
"Documentation" = "https://ciscodevnet.github.io/sccfm-devkit/"
"Bug Tracker" = "https://github.com/CiscoDevNet/sccfm-devkit/issues"
"Changelog" = "https://github.com/CiscoDevNet/sccfm-devkit/releases"

[tool.poetry.dependencies]
python = "^3.12"
click = ">=8.0.0,<9"
rich = "^14.2.0"
click-option-group = "^0.5.9"
scc-firewall-manager-sdk = "1.17.27"
questionary = "^2.1.1"
paramiko = "^3.5.0"

[tool.poetry.scripts]
sccfm-cli = "cisco_sccfm_cli.cli:cli"
devkit = "cisco_sccfm_scripts.devkit_cli:main"
build-ansible-collection = "cisco_sccfm_scripts.build_ansible_collection:main"
change-tokens = "cisco_sccfm_scripts.setup_tokens:main"
generate-ansible-docs = "cisco_sccfm_scripts.generate_ansible_docs:main"
generate-cli-docs = "cisco_sccfm_scripts.generate_cli_docs:main"
generate-cli-man-docs = "cisco_sccfm_scripts.generate_cli_man_docs:main"
install-cli-man-docs = "cisco_sccfm_scripts.install_cli_man_docs:main"
sync-docs-readme = "cisco_sccfm_scripts.sync_docs_readme:main"
check-doc-links = "cisco_sccfm_scripts.check_doc_links:main"
check-doc-artifacts = "cisco_sccfm_scripts.check_doc_artifacts:main"

[tool.poetry.group.dev.dependencies]
ansible-core = "^2.17.0"
black = "^25.11.0"
click-man = "^0.5.1"
isort = "^7.0.0"
mypy = "^1.18.2"
pytest = "^9.0.1"
coverage = "^7.12.0"
pre-commit = "^4.5.0"
flake8 = "^7.1.1"
commitizen = "^3.27.0"
reuse = "^6.2.0"

[tool.poetry.group.build.dependencies]
pyyaml = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
explicit_package_bases = true
exclude = "(^build/|^dist/)"

disable_error_code = ["attr-defined", "misc", "call-arg", "arg-type"]

[[tool.mypy.overrides]]
module = [
  "ansible_collections.*",
  "ansible",
  "ansible.*",
  "click",
  "click.*",
  "click_option_group",
  "click_option_group.*",
  "click_man",
  "click_man.*",
  "rich",
  "rich.*",
  "scc_firewall_manager_sdk",
  "scc_firewall_manager_sdk.*",
  "_pytest.*",
  "pytest",
  "questionary",
  "questionary.*",
  "paramiko",
  "paramiko.*",
  "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["cisco_sccfm_cli", "cisco_sccfm_core"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["cisco_sccfm_cli", "cisco_sccfm_core", "sccfm-ansible", "tests"]
norecursedirs = ["sccfm-ansible/e2e", "cisco_sccfm_cli/e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ci: CI integration tests that run against a real SCCFM tenant",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
