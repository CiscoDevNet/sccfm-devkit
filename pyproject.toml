[project]
name = "cisco-sccfm-devkit"
version = "0.39.0"
description = "Cisco SCC Firewall Manager CLI and Python automation library"
authors = [{ name = "Cisco Security Cloud Control Firewall Manager Team" }]
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["Cisco", "SCCFM", "Firewall Manager", "CLI", "Ansible", "Security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.3.3,<9",
    "rich>=14.2.0,<15",
    "click-option-group>=0.5.9,<0.6",
    "scc-firewall-manager-sdk==1.17.27",
    "paramiko>=5.0.0,<6",
    "cryptography>=50.0.0,<51",
    "pygments>=2.20.0,<3",
]

[project.urls]
Homepage = "https://github.com/CiscoDevNet/sccfm-devkit"
Repository = "https://github.com/CiscoDevNet/sccfm-devkit"
Documentation = "https://ciscodevnet.github.io/sccfm-devkit/"
"Bug Tracker" = "https://github.com/CiscoDevNet/sccfm-devkit/issues"
Changelog = "https://github.com/CiscoDevNet/sccfm-devkit/releases"

[project.scripts]
sccfm-cli = "cisco_sccfm_cli.cli:cli"

[tool.poetry]
packages = [
    { include = "cisco_sccfm_cli" },
    { include = "cisco_sccfm_core" },
]
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "INSTALL.md", format = "sdist" },
    { path = "SECURITY.md", format = "sdist" },
]
exclude = [
    "cisco_sccfm_scripts",
    "**/tests",
    "**/e2e",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
]

[tool.poetry.group.dev.dependencies]
cisco-sccfm-devtools = { path = "devtools", develop = true }
ansible-core = ">=2.20,<2.22"
black = "^25.11.0"
click-man = "^0.5.1"
isort = "^7.0.0"
mypy = "^1.18.2"
pytest = "^9.0.1"
coverage = "^7.12.0"
pre-commit = "^4.5.0"
flake8 = "^7.1.1"
commitizen = "^3.27.0"
reuse = "^6.2.0"
questionary = "^2.1.1"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
explicit_package_bases = true
exclude = "(^build/|^dist/)"

disable_error_code = ["attr-defined", "misc", "call-arg", "arg-type"]

[[tool.mypy.overrides]]
module = [
  "ansible_collections.*",
  "ansible",
  "ansible.*",
  "click",
  "click.*",
  "click_option_group",
  "click_option_group.*",
  "click_man",
  "click_man.*",
  "rich",
  "rich.*",
  "scc_firewall_manager_sdk",
  "scc_firewall_manager_sdk.*",
  "_pytest.*",
  "pytest",
  "questionary",
  "questionary.*",
  "paramiko",
  "paramiko.*",
  "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["cisco_sccfm_cli", "cisco_sccfm_core"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["cisco_sccfm_cli", "cisco_sccfm_core", "sccfm-ansible", "tests"]
norecursedirs = ["sccfm-ansible/e2e", "cisco_sccfm_cli/e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ci: CI integration tests that run against a real SCCFM tenant",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
