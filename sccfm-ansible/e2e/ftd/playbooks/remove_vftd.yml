---
# Remove CI vFTD devices from the SCCFM tenant.
#
# Runs as post-test cleanup so stale device records don't accumulate.
# Uses the CDO REST API directly since there is no delete_device module yet.

- name: "CI: Remove vFTD from SCCFM tenant"
  hosts: localhost
  gather_facts: false

  vars:
    sccfm_api_base: "https://ci.manage.security.cisco.com/api/rest"
    sccfm_api_token: "{{ lookup('env', 'API_TOKEN') }}"
    ftd_test_query_all: "name:ci-e2e-ftd-*"

  tasks:
    - name: Find CI vFTD devices
      ansible.builtin.uri:
        url: "{{ sccfm_api_base }}/v1/inventory/devices?limit=50&offset=0&q={{ ftd_test_query_all | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ sccfm_api_token }}"
          Content-Type: "application/json"
        status_code: [200]
      register: device_list

    - name: Delete each CI vFTD device
      ansible.builtin.uri:
        url: "{{ sccfm_api_base }}/v1/inventory/devices/{{ item.uid }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ sccfm_api_token }}"
          Content-Type: "application/json"
        status_code: [200, 202, 204, 404]
      loop: "{{ device_list.json['items'] | default([]) }}"
      loop_control:
        label: "{{ item.name }} ({{ item.uid }})"
      when: device_list.json['items'] | default([]) | length > 0
