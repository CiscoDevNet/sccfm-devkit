---
# Re-delete the already-deleted access rule and assert no change (idempotency).

- name: "CI: Delete idempotency check"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      region: "{{ sccfm_region }}"
      api_token: "{{ sccfm_api_token }}"

  tasks:
    - name: Read cached rule UID
      ansible.builtin.slurp:
        src: "/tmp/ci_access_rule_uid"
      register: cached_uid

    - name: Re-delete access rule
      cisco.sccfm.delete_access_rule:
        uid: "{{ cached_uid.content | b64decode | trim }}"
      register: delete_result

    - name: Assert no change on re-delete
      ansible.builtin.assert:
        that:
          - not delete_result.changed
        fail_msg: "Expected no change when re-deleting an already-deleted rule"
