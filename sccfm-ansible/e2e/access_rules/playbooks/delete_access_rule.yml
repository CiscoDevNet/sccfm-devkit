---
# Delete the test access rule.

- name: "CI: Delete access rule"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: Read cached rule UID
      ansible.builtin.slurp:
        src: "/tmp/ci_access_rule_uid"
      register: cached_uid

    - name: Delete access rule
      cisco.sccfm.delete_access_rule:
        uid: "{{ cached_uid.content | b64decode | trim }}"
      register: delete_result

    - name: Assert rule was deleted
      ansible.builtin.assert:
        that:
          - delete_result.changed
          - delete_result.deleted_uid is defined
        fail_msg: "Expected access rule deletion to report changed and return deleted_uid"
