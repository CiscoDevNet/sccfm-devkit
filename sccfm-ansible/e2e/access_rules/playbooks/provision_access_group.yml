---
# Provision a global access-group on the CI ASA so the CRUD phases have an
# access group to work with.  A freshly onboarded vASA has no ACLs.

- name: "CI: Provision test access group"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: Create source network object for access rule tests
      cisco.sccfm.create_network_object:
        name: "{{ test_source_network }}"
        value: "198.51.100.1"
        description: "CI E2E source host for access rule tests"
      register: src_obj
      failed_when:
        - src_obj is failed
        - "'already exists' not in (src_obj.msg | default('') | lower)"

    - name: Create destination network object for access rule tests
      cisco.sccfm.create_network_object:
        name: "{{ test_destination_network }}"
        value: "198.51.100.2"
        description: "CI E2E destination host for access rule tests"
      register: dst_obj
      failed_when:
        - dst_obj is failed
        - "'already exists' not in (dst_obj.msg | default('') | lower)"

    # The API rejects script pushes against a NOT_SYNCED device, and the
    # suites that run before this one leave the vASA re-syncing.  Filtering
    # on configState makes the module report "No devices found" until the
    # device is SYNCED, so retry only on that.  This wait plus the read below
    # must stay well under the 300s playbook timeout in conftest.py.
    #
    # No "configure terminal"/"end": SCCFM applies scripts containing them
    # but reports "Command failed".  The core services (e.g.
    # asa_boot_image_service) also send bare config lines.
    - name: Create test ACL and apply as global access-group (waits for SYNCED)
      cisco.sccfm.execute_asa_cli:
        query: "{{ asa_test_query }} AND configState:SYNCED"
        commands:
          - "access-list {{ test_acl_name }} extended permit ip any any"
          - "access-group {{ test_acl_name }} global"
      register: cli_result
      until: >-
        cli_result is not failed
        or 'no devices found' not in (cli_result.msg | default('') | lower)
      retries: 12
      delay: 10

    - name: Show ASA response to the provisioning commands
      ansible.builtin.debug:
        var: cli_result.results

    # pytest only prints a playbook's output when its phase fails, so the
    # debug output above is lost when this phase passes.  Save the response
    # for list_access_groups.yml to print if the access group never appears.
    - name: Save ASA response for list_access_groups diagnostics
      ansible.builtin.copy:
        content: "{{ cli_result.results | to_nice_json }}"
        dest: "/tmp/ci_access_group_provision.json"
        mode: "0600"

    # execute_asa_cli only fails on API/transaction errors.  A rejected
    # script comes back on a successful result, either as a per-device
    # error_msg or as "Command failed"/"ERROR:" in the result text (the same
    # check asa_boot_image_service applies).
    - name: Assert the ASA accepted the provisioning commands
      ansible.builtin.assert:
        that:
          - cli_result.results | length == 1
          - cli_result.results | selectattr('error_msg') | list | length == 0
          - >-
            cli_result.results | map(attribute='result') | map('string')
            | select('search', '(?im)^ERROR:|Command failed') | list | length == 0
        fail_msg: >-
          Expected exactly one device with no CLI errors, got
          {{ cli_result.results | length }} result(s):
          {{ cli_result.results | items2dict(key_name='device_uid', value_name='result') }}
          (error_msg: {{ cli_result.results | map(attribute='error_msg') | list }})

    # SCCFM does not re-read the device after a CLI push: the ACL is on the
    # ASA but no access group appears until the configuration is read.
    - name: Read the ASA configuration into SCCFM
      cisco.sccfm.read_asa_config:
        uids: "{{ cli_result.results | map(attribute='device_uid') | list }}"
        wait: true
        timeout: 120
