---
# List network objects and verify test objects exist.

- name: "CI: Verify created objects"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: List ci-test network objects
      cisco.sccfm.list_network_objects:
        query: "{{ test_query }}"
        limit: 50
      register: result

    - name: Assert both objects appear in list
      ansible.builtin.assert:
        that:
          - result.count >= 2
          - test_object_names[0] in names
          - test_object_names[1] in names
        fail_msg: "Expected both ci-test objects in listing"
      vars:
        names: "{{ result.network_objects | map(attribute='name') | list }}"
