---
# Pre-clean: remove leftover test objects from prior runs.

- name: "CI: Pre-clean test objects"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: Delete test group
      cisco.sccfm.delete_network_group:
        name: "{{ test_group_name }}"
      register: delete_result
      failed_when:
        - delete_result.failed
        - "'not found' not in (delete_result.msg | lower)"

    - name: Delete test objects
      cisco.sccfm.delete_network_object:
        name: "{{ item }}"
      loop: "{{ test_object_names }}"
      register: delete_result
      failed_when:
        - delete_result.failed
        - "'not found' not in (delete_result.msg | lower)"
