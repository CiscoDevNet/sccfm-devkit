---
# Update test network objects.

- name: "CI: Update network objects"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      region: "{{ sccfm_region }}"
      api_token: "{{ sccfm_api_token }}"

  tasks:
    - name: Update host IP address and description
      cisco.sccfm.update_network_object:
        name: "{{ test_objects[0].name }}"
        value: "{{ updated_host_value }}"
        description: "{{ updated_host_description }}"
      register: update_host

    - name: Assert host was updated
      ansible.builtin.assert:
        that:
          - update_host.changed
          - update_host.network_object.literal == updated_host_value
        fail_msg: "Expected host literal to change to {{ updated_host_value }}"

    - name: Update subnet labels
      cisco.sccfm.update_network_object:
        name: "{{ test_objects[1].name }}"
        labels: "{{ updated_subnet_labels }}"
      register: update_subnet

    - name: Assert subnet was updated
      ansible.builtin.assert:
        that:
          - update_subnet.changed
        fail_msg: "Expected subnet label update to report changed"
