---
# List local users on CI ASA devices.

- name: "CI: List ASA local users"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: List local users on CI ASA devices
      cisco.sccfm.list_asa_local_users:
        query: "{{ asa_test_query }}"
      register: result

    - name: Assert results returned
      ansible.builtin.assert:
        that:
          - result.results | length > 0
          - result.results[0].device_uid is defined
        fail_msg: "Expected local user data from at least one ASA device"
