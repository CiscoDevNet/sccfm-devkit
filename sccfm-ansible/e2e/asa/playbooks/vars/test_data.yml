---
# Device selection — CI tenant must have ASA(s) named targaryen-ansible-upgrade-01
asa_test_query: "name:targaryen-ansible-upgrade-01 AND connectivityState:ONLINE"
asa_test_query_all: "name:targaryen-ansible-upgrade-01"

# Read-only CLI commands for execute_asa_cli
asa_cli_commands:
  - "show version"
  - "show running-config hostname"

# For list_asa_not_on_version — fake version no device should be on
asa_not_on_version: "9.99(0)"

# Shun lifecycle — RFC 5737 TEST-NET addresses (safe, non-routable)
shun_test_source_ip: "198.51.100.1"
shun_test_entries:
  - source_ip: "198.51.100.1"
  - source_ip: "198.51.100.2"
shun_test_source_ips:
  - "198.51.100.1"
  - "198.51.100.2"

# Upgrade workflow — staging only (no reboot)
# Uncomment and set to a real compatible version for the CI test ASA
# asa_upgrade_software_version: "9.6(4.14)"
# asa_upgrade_name: "targaryen-ansible-upgrade-01"
