---
# Remove a specific shun entry by source IP on CI ASA devices.

- name: "CI: Remove ASA shun entry"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: Remove one shun entry by source IP
      cisco.sccfm.remove_asa_shun:
        query: "{{ asa_test_query }}"
        source_ip: "{{ shun_test_source_ip }}"
      register: result

    - name: Assert shun entry was removed
      ansible.builtin.assert:
        that:
          - result.changed
          - result.results | length > 0
        fail_msg: "Expected shun entry {{ shun_test_source_ip }} to be removed"
