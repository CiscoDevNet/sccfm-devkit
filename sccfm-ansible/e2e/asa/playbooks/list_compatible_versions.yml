---
# List compatible software versions for CI ASA devices.

- name: "CI: List ASA compatible versions"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      region: "{{ sccfm_region }}"
      api_token: "{{ vault_sccfm_api_token }}"

  tasks:
    - name: List compatible versions for CI ASA devices
      cisco.sccfm.list_asa_compatible_versions:
        query: "{{ asa_test_query }}"
      register: result

    - name: Assert version data returned
      ansible.builtin.assert:
        that:
          - result.compatible_versions is defined or result.common_versions is defined
        fail_msg: "Expected compatible version data from at least one ASA device"
