---
# Show active shun entries on CI ASA devices.

- name: "CI: Show ASA shun entries"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: Show shun entries on CI ASA devices
      cisco.sccfm.show_asa_shun:
        query: "{{ asa_test_query }}"
      register: result

    - name: Assert shun entries are visible
      ansible.builtin.assert:
        that:
          - result.results | length > 0
        fail_msg: "Expected to see active shun entries after adding them"
