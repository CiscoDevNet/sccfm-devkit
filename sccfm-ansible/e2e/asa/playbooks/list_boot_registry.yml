---
# List boot registry information from CI ASA devices.

- name: "CI: List ASA boot registry"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      region: "{{ sccfm_region }}"
      api_token: "{{ vault_sccfm_api_token }}"

  tasks:
    - name: List boot registry on CI ASA devices
      cisco.sccfm.list_asa_boot_registry:
        query: "{{ asa_test_query }}"
      register: result

    - name: Assert at least one device returned results
      ansible.builtin.assert:
        that:
          - result.results | length > 0
          - result.results[0].device_uid is defined
          - result.results[0].system_image_file is defined
        fail_msg: "Expected boot registry data from at least one ASA device"
