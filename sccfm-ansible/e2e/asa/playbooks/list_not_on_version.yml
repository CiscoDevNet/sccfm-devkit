---
# List ASA devices not running a specific version.

- name: "CI: List ASA devices not on version"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  tasks:
    - name: List ASA devices not on fake version
      cisco.sccfm.list_asa_not_on_version:
        query: "{{ asa_test_query }}"
        version: "{{ asa_not_on_version }}"
      register: result

    - name: Assert all CI devices are returned (none should be on fake version)
      ansible.builtin.assert:
        that:
          - result.device_count > 0
          - result.devices | length > 0
          - result.devices[0].uid is defined
          - result.devices[0].software_version is defined
        fail_msg: "Expected all CI ASA devices to be not on version {{ asa_not_on_version }}"
