---
# Stage an ASA upgrade (download + readiness check, no reboot).

- name: "CI: Stage ASA upgrade"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../examples/group_vars/all/vars.yml
    - ../../../examples/group_vars/all/vault.yml
    - vars/test_data.yml

  module_defaults:
    group/cisco.sccfm.all:
      region: "{{ sccfm_region }}"
      api_token: "{{ sccfm_api_token }}"

  tasks:
    - name: Verify upgrade version is configured
      ansible.builtin.assert:
        that:
          - asa_upgrade_software_version is defined
        fail_msg: >-
          asa_upgrade_software_version must be set in test_data.yml.
          Uncomment and set to a real compatible version for the CI test ASA.

    - name: Stage upgrade on CI ASA devices
      cisco.sccfm.trigger_asa_upgrade:
        query: "{{ asa_test_query }}"
        software_version: "{{ asa_upgrade_software_version }}"
        asdm_version: "{{ asa_upgrade_asdm_version | default(omit) }}"
        stage_upgrade: true
        wait: true
        timeout: 600
        upgrade_name: "{{ asa_upgrade_name | default('ci-e2e-upgrade-stage') }}"
      register: result

    - name: Assert upgrade was staged
      ansible.builtin.assert:
        that:
          - result.device_count > 0
          - result.transaction is defined
        fail_msg: "Expected upgrade to be staged on at least one ASA device"
