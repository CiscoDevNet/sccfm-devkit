---
requires_ansible: ">=2.15.0"

action_groups:
  cisco.sccfm.all:
    - add_asa_shun
    - change_asa_boot_image
    - change_asa_local_password
    - clear_asa_shun
    - create_network_group
    - deploy_cdfmc_ftd
    - create_network_object
    - delete_network_group
    - delete_network_object
    - execute_asa_cli
    - list_asa_boot_registry
    - list_asa_compatible_versions
    - list_asa_disk_files
    - list_asa_local_users
    - list_asa_not_on_version
    - list_network_groups
    - list_network_objects
    - onboard_asa
    - remove_asa_shun
    - show_asa_shun
    - trigger_asa_upgrade
    - update_network_group
    - update_network_object

module_defaults:
  group/cisco.sccfm.all:
    region: null
    api_token: null
