namespace: cisco
name: sccfm
version: 0.39.1
readme: README.md
authors:
- Cisco Security Cloud Control Firewall Manager Team
description: Ansible modules and dynamic inventory for Cisco Security Cloud Control
  Firewall Manager.
license_file: LICENSE
tags:
- cisco
- sccfm
- security
- firewall
- cloud
- collection
repository: https://github.com/CiscoDevNet/sccfm-devkit
documentation: https://ciscodevnet.github.io/sccfm-devkit/
homepage: https://github.com/CiscoDevNet/sccfm-devkit
issues: https://github.com/CiscoDevNet/sccfm-devkit/issues
build_ignore:
