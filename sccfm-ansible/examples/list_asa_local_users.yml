---
- hosts: localhost
  gather_facts: false
  vars:
    sccfm_api_token_effective: "{{ vault_sccfm_api_token | default(lookup('env', 'SCCFM_API_TOKEN'), true) }}"
  module_defaults:
    group/cisco.sccfm.all:
      region: "{{ lookup('env', 'SCCFM_REGION') }}"
      api_token: "{{ sccfm_api_token_effective }}"
  tasks:
    - name: Get list of ASA local users for UIDs
      cisco.sccfm.list_asa_local_users:
        uids:
          - "00000000-0000-0000-0000-000000000001"
          - "00000000-0000-0000-0000-000000000002"
      register: local_users_by_uids

    - name: Show ASA local users by UID
      ansible.builtin.debug:
        msg: "{{ local_users_by_uids.asa_local_users }}"

    - name: Get list of ASA local users by query
      cisco.sccfm.list_asa_local_users:
        query: "connectivityState:ONLINE"
      register: local_users_by_query

    - name: Show ASA local users by query
      ansible.builtin.debug:
        msg: "{{ local_users_by_query.asa_local_users }}"
