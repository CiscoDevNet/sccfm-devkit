---
# End-to-end local user password change on ASA devices via SCCFM
#
# This playbook demonstrates the full lifecycle: create a local user,
# change its password, verify the result, and clean up.
#
# RUN THIS PLAYBOOK:
#   ansible-playbook examples/change_asa_local_password.yml \
#     -e initial_password='<initial-password>' \
#     -e new_password='<new-password>'
#
# Optionally target a specific device (otherwise the first SYNCED device is used):
#   ansible-playbook examples/change_asa_local_password.yml \
#     -e device_uid=<your-device-uid> \
#     -e initial_password='<initial-password>' \
#     -e new_password='<new-password>'
#
# PREREQUISITES:
#   - SCCFM_REGION and SCCFM_API_TOKEN environment variables set, OR
#   - SCCFM_REGION set and vault_sccfm_api_token in encrypted group_vars/all/vault.yml
#
# NOTE: Config commands require the device to be in SYNCED state.
#       Passwords with 3+ sequential or repetitive characters (e.g. "1234",
#       "aaa") may be rejected by the ASA password policy.

- name: Local user password lifecycle — create, change, verify, clean up
  hosts: localhost
  gather_facts: false

  module_defaults:
    group/cisco.sccfm.all:
      region: "{{ lookup('env', 'SCCFM_REGION') }}"
      api_token: "{{ sccfm_api_token_effective }}"

  vars:
    sccfm_api_token_effective: "{{ vault_sccfm_api_token | default(lookup('env', 'SCCFM_API_TOKEN'), true) }}"
    device_uid: ""
    test_user: devkit-example-user
    initial_password: "{{ vault_initial_password | default('') }}"
    new_password: "{{ vault_new_password | default('') }}"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - initial_password | length > 0
          - new_password | length > 0
        fail_msg: >-
          Provide required vars: initial_password and new_password.

    - name: Discover first available SYNCED device
      cisco.sccfm.execute_asa_cli:
        query: "connectivityState:ONLINE AND configState:SYNCED"
        limit: 1
        commands:
          - "show version"
      register: discovered
      when: device_uid | length == 0

    - name: Set resolved device UID
      ansible.builtin.set_fact:
        resolved_uid: "{{ device_uid if device_uid | length > 0 else discovered.results[0].device_uid }}"

    - name: Show which device will be used
      ansible.builtin.debug:
        msg: "Using device UID: {{ resolved_uid }}"

    # ============================================================
    # 1. Create a local user
    # ============================================================
    - name: Create a local user on the ASA
      cisco.sccfm.execute_asa_cli:
        uids:
          - "{{ resolved_uid }}"
        commands:
          - "username {{ test_user }} password {{ initial_password }} privilege 15"
      register: create_result

    - name: Display create result
      ansible.builtin.debug:
        msg: "Created user '{{ test_user }}' on device {{ resolved_uid }}"
      when: create_result is defined

    # ============================================================
    # 2. Change the password
    # ============================================================
    - name: Change password for the local user
      cisco.sccfm.change_asa_local_password:
        uids:
          - "{{ resolved_uid }}"
        username: "{{ test_user }}"
        new_password: "{{ new_password }}"
      register: password_results

    - name: Display password change results
      ansible.builtin.debug:
        msg: "{{ item.device_uid }}: {{ item.status }} - {{ item.message }}"
      loop: "{{ password_results.results | default([]) }}"
      loop_control:
        label: "{{ item.device_uid }}"
      when: password_results.results is defined

    # ============================================================
    # 3. Check for failures
    # ============================================================
    - name: Check for any failed password changes
      ansible.builtin.fail:
        msg: >
          Password change failed on devices:
          {{ password_results.results
             | selectattr('status', 'ne', 'success')
             | map(attribute='device_uid')
             | list }}
      when:
        - password_results.results is defined
        - password_results.results | selectattr('status', 'ne', 'success') | list | length > 0

    # ============================================================
    # 4. Clean up — remove the test user
    # ============================================================
    - name: Delete the test user from the ASA
      cisco.sccfm.execute_asa_cli:
        uids:
          - "{{ resolved_uid }}"
        commands:
          - "no username {{ test_user }}"
      register: delete_result

    - name: Display delete result
      ansible.builtin.debug:
        msg: "Deleted user '{{ test_user }}' from device {{ resolved_uid }}"
      when: delete_result is defined

    # ============================================================
    # Alternative examples (commented out)
    # ============================================================

    # Change password on ASAs matching a query:
    # - name: Change admin password on all online ASAs
    #   cisco.sccfm.change_asa_local_password:
    #     query: "connectivityState:ONLINE"
    #     username: admin
    #     new_password: "{{ vault_new_asa_password }}"

    # Change password on ASAs by name pattern:
    # - name: Change admin password on branch ASAs
    #   cisco.sccfm.change_asa_local_password:
    #     query: "name:branch-* AND connectivityState:ONLINE"
    #     username: admin
    #     new_password: "{{ vault_new_asa_password }}"
