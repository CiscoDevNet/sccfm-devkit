---
# Execute CLI commands on ASA devices via SCCFM
#
# QUICK TEST (adhoc command):
#   ansible localhost -m cisco.sccfm.execute_asa_cli \
#     -a 'query="connectivityState:ONLINE" limit=1 commands="show version"'
#
# RUN THIS PLAYBOOK:
#   ansible-playbook examples/execute_asa_cli.yml
#
# Optionally pass a device UID to run UID-specific examples:
#   ansible-playbook examples/execute_asa_cli.yml \
#     -e device_uid=<your-device-uid>
#
# NOTE: Show commands require ONLINE. Config commands require SYNCED.

- name: Execute CLI commands on ASA devices
  hosts: localhost
  gather_facts: false

  # Use module_defaults to select one named profile for all collection tasks
  module_defaults:
    group/cisco.sccfm.all:
      profile: default

  vars:
    device_uid: ""
    show_commands:
      - "show version"
      - "show running-config"
      - "show interface"

  tasks:
    # ============================================================
    # QUICK TEST: Run this first to verify the module works
    # Devices must be ONLINE for CLI execution to succeed
    # ============================================================
    - name: "Quick test: Show version on first available online device"
      cisco.sccfm.execute_asa_cli:
        query: "connectivityState:ONLINE AND configState:SYNCED"
        limit: 1
        commands:
          - "show version"
      register: quick_test_result

    - name: Display quick test result
      ansible.builtin.debug:
        msg: |
          SUCCESS! Device {{ quick_test_result.results[0].device_uid }} responded:
          {{ quick_test_result.results[0].result }}
      when: quick_test_result.results is defined and quick_test_result.results | length > 0

    - name: Set resolved device UID (use provided or auto-discovered)
      ansible.builtin.set_fact:
        resolved_uid: "{{ device_uid if device_uid | length > 0 else quick_test_result.results[0].device_uid }}"
      when: quick_test_result.results is defined and quick_test_result.results | length > 0

    # ============================================================
    # Example 1: Filter by device name pattern
    # Uncomment and adjust the name pattern to match your devices
    # ============================================================
    # - name: Show version on branch ASAs
    #   cisco.sccfm.execute_asa_cli:
    #     query: "name:branch-* AND connectivityState:ONLINE"
    #     commands:
    #       - "show version"
    #   register: branch_results

    # ============================================================
    # Example 2: Execute CLI commands on specific devices by UID
    # This approach skips the inventory lookup - faster when you know the UIDs
    # ============================================================
    - name: "UID test: Execute commands on specific ASA by UID"
      cisco.sccfm.execute_asa_cli:
        uids:
          - "{{ resolved_uid }}"
        commands:
          - "show clock"
          - "show hostname"
      register: uid_results
      when: resolved_uid is defined

    - name: Display UID-based execution results
      ansible.builtin.debug:
        msg: |
          Device {{ uid_results.results[0].device_uid }}:
          {{ uid_results.results[0].result }}
      when: uid_results.results is defined and uid_results.results | length > 0

    # ============================================================
    # Example 3: Execute multiple commands using a variable
    # ============================================================
    - name: Run multiple show commands on all synced ASAs
      cisco.sccfm.execute_asa_cli:
        query: "connectivityState:ONLINE"
        commands: "{{ show_commands }}"
      register: multi_cmd_results

    - name: Display multi-command results
      ansible.builtin.debug:
        msg: |
          Device {{ item.device_uid }}:
          {{ item.result | default('No output') }}
      loop: "{{ multi_cmd_results.results | default([]) }}"
      loop_control:
        label: "{{ item.device_uid }}"
      when: multi_cmd_results.results is defined and multi_cmd_results.results | length > 0

    # ============================================================
    # Example 4: Use Ansible's lookup to read commands from a file
    # Create a file called 'scripts/show_commands.txt' with one command per line
    # - name: Execute commands from file
    #   cisco.sccfm.execute_asa_cli:
    #     query: "connectivityState:ONLINE"
    #     commands: "{{ lookup('file', 'scripts/show_commands.txt').splitlines() }}"
    #   register: file_results

    # ============================================================
    # Example 5: Configuration commands (not just show commands)
    # NOTE: Config commands require device to be in SYNCED state!
    # Show commands only require ONLINE state.
    # ============================================================
    # - name: Add a local user
    #   cisco.sccfm.execute_asa_cli:
    #     uids:
    #       - "{{ device_uid }}"
    #     commands:
    #       - "username testuser password TestPass123 privilege 15"
    #   register: user_result

    # ============================================================
    # Example 6: Multi-line configuration commands
    # Some ASA configs require entering a submode (e.g., object network)
    # Use a multi-line string with the | (literal block) YAML syntax
    # ============================================================
    # - name: Create a network object with host
    #   cisco.sccfm.execute_asa_cli:
    #     uids:
    #       - "{{ device_uid }}"
    #     commands:
    #       - |
    #         object network my-test-host
    #         host 192.168.1.100
    #   register: object_result

    # ============================================================
    # Example 7: Multiple multi-line config blocks
    # ============================================================
    # - name: Create multiple network objects
    #   cisco.sccfm.execute_asa_cli:
    #     uids:
    #       - "{{ device_uid }}"
    #     commands:
    #       - |
    #         object network web-server
    #         host 10.0.0.10
    #         description Production web server
    #       - |
    #         object network db-server
    #         host 10.0.0.20
    #         description Production database server
    #   register: multi_object_result

    # ============================================================
    # Example 8: Using pagination for large device sets
    # ============================================================
    - name: Execute on first 10 matching devices
      cisco.sccfm.execute_asa_cli:
        query: "connectivityState:ONLINE"
        limit: 10
        offset: 0
        commands:
          - "show clock"
      register: paginated_results
      ignore_errors: true

    - name: Summary of execution
      ansible.builtin.debug:
        msg: "Executed commands on {{ paginated_results.results | length }} device(s)"
      when: paginated_results.results is defined
