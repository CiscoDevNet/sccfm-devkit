---
# Plain variables (not sensitive)
# These can be committed to version control

# Compatibility setting for existing projects; packaged examples read SCCFM_REGION directly
sccfm_region: "{{ lookup('env', 'SCCFM_REGION') }}"

# Common ASA configuration
default_asa_username: asavuser
default_ignore_certificate: true

# Default connector settings
default_connector_type: CDG
